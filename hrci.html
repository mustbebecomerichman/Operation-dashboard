<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HRCI Index — Operation Dashboard</title>
<style>
  :root{--bg:#f0f4f8;--white:#fff;--accent:#1e40af;--accent2:#2563eb;--up:#dc2626;--down:#059669;--txt:#1e293b;--muted:#64748b;--border:#e2e8f0;--r:8px;--sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(30,64,175,.14)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
  .hdr{background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 55%,#2563eb 100%);color:#fff;height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.22)}
  .hdr-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .hdr-back{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;text-decoration:none}
  .hdr-back:hover{background:rgba(255,255,255,.28)}
  .wrap{max-width:1200px;margin:14px auto;padding:0 14px}
  .card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
  h2{font-size:16px;margin-bottom:12px;font-weight:700;color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px 14px}
  .kpi-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi-v{font-size:22px;font-weight:700;margin-top:3px}
  .kpi-d{font-size:11px;margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)}
  #chartWrap{position:relative;width:100%;height:380px}
  #chart{width:100%;height:100%;display:block}
  #tooltip{position:absolute;display:none;background:rgba(15,23,42,.94);color:#fff;font-size:11px;padding:6px 9px;border-radius:4px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-110%)}
  .ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}
  .ctrls label{font-size:12px;color:var(--muted)}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:#f8fafc}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  .desc{color:var(--muted);font-size:11px}
  .muted{color:var(--muted)}
  .err{color:#dc2626;background:#fef2f2;padding:8px 12px;border-radius:4px;font-size:12px}
  @media(max-width:600px){
    #chartWrap{height:300px}
    .wrap{padding:0 8px}
    table{font-size:11px}
    th,td{padding:4px 6px}
  }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-title">HRCI Index Historical Data</div>
  <a href="delay_dashboard.html" class="hdr-back">← Back to Dashboard</a>
</header>
<main class="wrap">
  <section class="card">
    <h2>1 Year G. Index — Howe Robinson Containership Index</h2>
    <div class="desc">Monthly snapshots, 1993–2026. Source: <code>HRCI weekly index.xlsx</code> → <code>data/hrci-timeline.json</code></div>
    <div class="kpis" id="kpis"></div>
    <div id="chartWrap">
      <svg id="chart" viewBox="0 0 1200 380" preserveAspectRatio="none" aria-label="HRCI timeline"></svg>
      <div id="tooltip"></div>
    </div>
  </section>

  <section class="card">
    <h2>Vessel size category breakdown</h2>
    <div class="ctrls">
      <label for="ySel">Year</label>
      <select id="ySel"></select>
    </div>
    <div style="overflow:auto;max-height:520px">
      <table id="catTable">
        <thead>
          <tr>
            <th>Category</th><th>Description</th>
            <th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>May</th><th>Jun</th>
            <th>Jul</th><th>Aug</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dec</th>
            <th>Avg</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var fmt = function(n){ return (n===null||n===undefined||isNaN(n))?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:1}); };
  var pct = function(n){ if(n===null||isNaN(n)) return ''; var s=n>0?'+':''; return s+n.toFixed(1)+'%'; };

  function fail(msg){
    document.querySelector('main').innerHTML = '<section class="card"><div class="err">' + msg + '</div></section>';
  }

  Promise.all([
    fetch('data/hrci-timeline.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('timeline '+r.status);return r.json();}),
    fetch('data/hrci-vessel-categories.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('categories '+r.status);return r.json();})
  ]).then(function(arr){
    renderAll(arr[0], arr[1]);
  }).catch(function(err){
    fail('Failed to load data: ' + err.message + '. Make sure data/hrci-timeline.json and data/hrci-vessel-categories.json are present.');
  });

  function renderAll(timeline, cats){
    var points = timeline.points || [];
    if(!points.length){ fail('Timeline has no points.'); return; }
    renderKpis(points);
    renderChart(points);
    renderYearPicker(cats);
  }

  function renderKpis(points){
    var last = points[points.length-1];
    var prev = points[points.length-2];
    var lastYr = last.year;
    var lyAvg = avgForYear(points, lastYr - 1);
    var thisYrAvg = avgForYear(points, lastYr);
    var lo = Math.min.apply(null, points.map(function(p){return p.value;}));
    var hi = Math.max.apply(null, points.map(function(p){return p.value;}));
    var mom = prev ? ((last.value - prev.value) / prev.value * 100) : null;
    var yoy = (lyAvg !== null && thisYrAvg !== null) ? ((thisYrAvg - lyAvg) / lyAvg * 100) : null;

    var html = '';
    html += kpi('Latest', fmt(last.value), last.year + '-' + String(last.month).padStart(2,'0'));
    html += kpi('MoM Δ', pct(mom), mom>0?'rising':'falling', mom>0?'up':'down');
    html += kpi(lastYr + ' YTD avg', fmt(thisYrAvg), 'vs ' + (lastYr-1) + ' avg ' + fmt(lyAvg));
    html += kpi('YoY Δ', pct(yoy), yoy>0?'up':'down', yoy>0?'up':'down');
    html += kpi('All-time range', fmt(lo) + ' – ' + fmt(hi), '');
    html += kpi('Data points', points.length, points[0].year + '–' + last.year);
    document.getElementById('kpis').innerHTML = html;
  }
  function kpi(label, value, sub, cls){
    var c = cls ? ' '+cls : '';
    return '<div class="kpi"><div class="kpi-l">'+label+'</div><div class="kpi-v'+c+'">'+value+'</div><div class="kpi-d'+c+'">'+(sub||'')+'</div></div>';
  }
  function avgForYear(points, yr){
    var ys = points.filter(function(p){return p.year===yr;});
    if(!ys.length) return null;
    return ys.reduce(function(a,b){return a+b.value;},0) / ys.length;
  }

  function renderChart(points){
    var svg = document.getElementById('chart');
    var W = 1200, H = 380, pad = {l:50, r:20, t:20, b:36};
    var xs = points.map(function(p,i){return i;});
    var ys = points.map(function(p){return p.value;});
    var minY = Math.min.apply(null, ys);
    var maxY = Math.max.apply(null, ys);
    var minX = 0, maxX = xs.length - 1;
    var rangeY = maxY - minY || 1;
    function sx(i){ return pad.l + (i - minX) / (maxX - minX) * (W - pad.l - pad.r); }
    function sy(v){ return H - pad.b - (v - minY) / rangeY * (H - pad.t - pad.b); }

    var parts = [];
    // Y-axis gridlines + labels (5 ticks)
    for (var k = 0; k <= 5; k++) {
      var yv = minY + rangeY * k / 5;
      var py = sy(yv);
      parts.push('<line x1="'+pad.l+'" y1="'+py+'" x2="'+(W-pad.r)+'" y2="'+py+'" stroke="#e2e8f0" stroke-width="1"/>');
      parts.push('<text x="'+(pad.l-6)+'" y="'+(py+3)+'" font-size="10" fill="#64748b" text-anchor="end">'+fmt(yv)+'</text>');
    }
    // X-axis labels (year ticks)
    var yearStarts = {};
    points.forEach(function(p, i){
      if (yearStarts[p.year] === undefined) yearStarts[p.year] = i;
    });
    var yrKeys = Object.keys(yearStarts).map(Number);
    var stride = Math.ceil(yrKeys.length / 12);
    yrKeys.forEach(function(yr, idx){
      if (idx % stride !== 0 && idx !== yrKeys.length - 1) return;
      var i = yearStarts[yr];
      var px = sx(i);
      parts.push('<line x1="'+px+'" y1="'+pad.t+'" x2="'+px+'" y2="'+(H-pad.b)+'" stroke="#f1f5f9" stroke-width="1"/>');
      parts.push('<text x="'+px+'" y="'+(H-pad.b+16)+'" font-size="10" fill="#64748b" text-anchor="middle">'+yr+'</text>');
    });
    // Line path
    var d = points.map(function(p,i){ return (i===0?'M':'L') + sx(i).toFixed(1) + ',' + sy(p.value).toFixed(1); }).join(' ');
    parts.push('<path d="'+d+'" fill="none" stroke="#2563eb" stroke-width="1.7"/>');
    // Invisible hover targets
    parts.push('<g id="hover-targets">');
    points.forEach(function(p, i){
      parts.push('<rect data-i="'+i+'" x="'+(sx(i)-3)+'" y="'+pad.t+'" width="6" height="'+(H-pad.t-pad.b)+'" fill="transparent" />');
    });
    parts.push('</g>');
    // Marker for hover
    parts.push('<circle id="hover-pt" cx="-10" cy="-10" r="4" fill="#2563eb" stroke="#fff" stroke-width="2" pointer-events="none"/>');
    svg.innerHTML = parts.join('');

    var tip = document.getElementById('tooltip');
    var wrap = document.getElementById('chartWrap');
    var pt = document.getElementById('hover-pt');
    svg.querySelectorAll('#hover-targets rect').forEach(function(rect){
      rect.addEventListener('mousemove', function(e){
        var i = +rect.getAttribute('data-i');
        var p = points[i];
        var px = sx(i), py = sy(p.value);
        pt.setAttribute('cx', px); pt.setAttribute('cy', py);
        // Convert SVG coord to client coord
        var ratio = wrap.clientWidth / W;
        tip.style.display = 'block';
        tip.style.left = (px * ratio) + 'px';
        tip.style.top  = (py * (wrap.clientHeight / H)) + 'px';
        tip.textContent = p.year + '-' + String(p.month).padStart(2,'0') + '  ·  ' + fmt(p.value);
      });
      rect.addEventListener('mouseleave', function(){
        tip.style.display = 'none';
        pt.setAttribute('cx', -10);
      });
    });
  }

  function renderYearPicker(cats){
    var years = Object.keys(cats.years || {}).sort();
    var sel = document.getElementById('ySel');
    if (!years.length) { sel.innerHTML = '<option>(no data)</option>'; return; }
    sel.innerHTML = years.map(function(y){ return '<option value="'+y+'">'+y+'</option>'; }).join('');
    sel.value = years[years.length - 1];
    sel.addEventListener('change', function(){ renderCatTable(cats.years[sel.value]); });
    renderCatTable(cats.years[sel.value]);
  }

  function renderCatTable(list){
    var tbody = document.querySelector('#catTable tbody');
    if (!list || !list.length) { tbody.innerHTML = '<tr><td colspan="15" class="muted">No data for this year</td></tr>'; return; }
    tbody.innerHTML = list.map(function(row){
      var months = (row.monthly || []).map(function(v){
        return '<td>' + (v===null||v===undefined ? '<span class="muted">-</span>' : fmt(v)) + '</td>';
      }).join('');
      return '<tr>'
        + '<td><b>' + row.cat + '</b></td>'
        + '<td class="desc">' + (row.desc || '') + '</td>'
        + months
        + '<td><b>' + (row.avg===null||row.avg===undefined ? '-' : fmt(row.avg)) + '</b></td>'
        + '</tr>';
    }).join('');
  }
})();
</script>
</body>
</html>
